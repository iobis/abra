<text x="30" y="48" font-size="24" font-weight="700" fill="#1f2933" text-anchor="start" >How the information metric works</text>
<text x="30" y="74" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start" >It counts what is new about an area &#8211; unique combinations of grid cell and taxon &#8211; not how many records were collected.</text>
